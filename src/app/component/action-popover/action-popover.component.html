<ion-list class="action-popover-list">
  <ion-item button (click)="selectAction('print')" class="action-item">
    <ion-icon name="print-outline" slot="start" class="action-icon"></ion-icon>
    <ion-label>طباعة</ion-label>
  </ion-item>

  <ion-item button (click)="selectAction('printStoreReport')" class="action-item">
    <ion-icon name="clipboard-outline" slot="start" class="action-icon"></ion-icon>
    <ion-label>تقرير المخزن</ion-label>
  </ion-item>

  <ion-item button (click)="selectAction('edit')" class="action-item">
    <ion-icon name="create-outline" slot="start" class="action-icon"></ion-icon>
    <ion-label>تعديل</ion-label>
  </ion-item>

  <ion-item button (click)="selectAction('verify')" class="action-item">
    <ion-icon name="checkmark-done-outline" slot="start" class="action-icon"></ion-icon>
    <ion-label>التحقق من الفاتورة</ion-label>
  </ion-item>

  <ion-item button (click)="selectAction('createReturn')" class="action-item" *ngIf="context !== 'returns'">
    <ion-icon name="return-down-back-outline" slot="start" class="action-icon"></ion-icon>
    <ion-label>إنشاء مرتجعة</ion-label>
  </ion-item>

  <!-- Only show copy options for invoices, not for orders -->
  <ng-container *ngIf="context === 'invoice'">
    <ion-item button (click)="selectAction('copySales')" class="action-item">
      <ion-icon name="copy-outline" slot="start" class="action-icon"></ion-icon>
      <ion-label>نسخ كفاتورة مبيعات</ion-label>
    </ion-item>

    <ion-item button (click)="selectAction('copyPurchase')" class="action-item">
      <ion-icon name="copy-outline" slot="start" class="action-icon"></ion-icon>
      <ion-label>نسخ كفاتورة مشتريات</ion-label>
    </ion-item>
  </ng-container>
</ion-list>
